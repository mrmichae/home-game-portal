services:
  home-game-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-game-portal-prototype
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-8090}:8090"
    environment:
      PORT: 8090
      ROM_LIBRARY_PATH: /roms
      DATA_DIR: /data
      SAVES_DIR: /saves
      ARTWORK_DIR: /artwork
    volumes:
      - type: bind
        source: ${ROM_LIBRARY_PATH:-./sample-library}
        target: /roms
        read_only: true
      - portal-data:/data
      - portal-saves:/saves
      - portal-artwork:/artwork
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  portal-data:
  portal-saves:
  portal-artwork:
