name: Container check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check application
        run: npm run check

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker compose build

      - name: Start production stack
        run: docker compose up -d

      - name: Verify health and container contract
        run: |
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8090/health
          container_id="$(docker compose ps -q home-game-portal)"
          test -n "$container_id"
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "node"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = "true"
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/roms"}}{{.RW}}{{end}}{{end}}' "$container_id")" = "false"
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_id" | grep -q 'ALL'

      - name: Verify restart persistence boundary
        run: |
          docker compose restart home-game-portal
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8090/health

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
